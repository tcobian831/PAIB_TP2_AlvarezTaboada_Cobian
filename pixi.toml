[workspace]
name = "paibb-tp2"
version = "1.0.0"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = ">=3.9,<3.10"
pip = "*"

[pypi-dependencies]
numpy = "==1.26.4"
scipy = "==1.13.1"
scikit-image = "==0.24.0"
pandas = "==2.2.3"
matplotlib = "==3.9.4"
pywavelets = "==1.6.0"
tifffile = "==2024.8.30"
imagecodecs = "==2024.12.30"
opencv-python-headless = "==4.10.0.84"
napari = "==0.5.6"
pyqt5 = "==5.15.11"
magicgui = "==0.10.1"
qtpy = "==2.4.3"
pyyaml = "==6.0.2"
simpleitk = "==2.4.1"
pyradiomics = "==3.1.0"
pytest = "==8.3.5"

[tasks]
widget = "python widget_tp2.py"
check = "python scripts/comprobar_entorno.py"
test = "python scripts/ejecutar_tests.py"
matriz = "python scripts/construir_matriz.py"
